server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed files, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # React Router owns client-side routes. Unknown paths fall back to the app
    # shell instead of returning nginx's 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
